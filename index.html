<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Someone's Surprise 🤣</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #ffd6e7,
        #ffc2d9
    );

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* MAIN CARD */

.card {
    width: 90%;
    max-width: 420px;

    background: white;

    padding: 30px 20px;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.15);

    position: relative;

    z-index: 5;
}


.hidden {
    display: none;
}


/* TEXT */

h1 {
    color: #ff4f81;
    margin-bottom: 10px;
}

h2 {
    color: #ff4f81;
}

p {
    color: #555;
    font-size: 17px;
}


/* GIFT */

.gift {
    font-size: 80px;

    cursor: pointer;

    margin: 20px 0;

    animation: bounce 1.2s infinite;

    user-select: none;
}

@keyframes bounce {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}


/* BUTTONS */

.buttons {
    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 25px;

    min-height: 55px;
}


button {
    border: none;

    padding: 14px 25px;

    border-radius: 30px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}


.yes {
    background: #ff4f81;
    color: white;
}


.no {
    background: #eeeeee;
    color: #444;
}


/* FLOATING EMOJIS */

.funnyEmoji {

    position: fixed;

    bottom: -60px;

    font-size: 30px;

    pointer-events: none;

    z-index: 2;

    animation:
        slowFloat
        12s linear forwards;
}


/* FLOATING TEXT */

.textEmoji {

    font-size: 20px;

    font-weight: bold;

    white-space: nowrap;

    color: #ff4f81;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,0.12);
}


/* SLOW FLOAT */

@keyframes slowFloat {

    0% {

        transform:
            translate(-50%, 0);

        opacity: 0;
    }


    10% {

        opacity: 1;
    }


    50% {

        transform:
            translate(-50%, -50vh);

        opacity: 1;
    }


    100% {

        transform:
            translate(-50%, -115vh);

        opacity: 0;
    }

}


/* TELEPORTING NO */

#noButton.teleport {

    position: fixed;

    z-index: 20;
}


/* CELEBRATION */

.celebration {

    font-size: 45px;

    margin-bottom: 10px;
}


.bigText {

    font-size: 26px;

    font-weight: bold;

    color: #ff4f81;
}


/* CONFETTI */

.confetti {

    position: fixed;

    top: -30px;

    font-size: 25px;

    animation:
        confettiFall
        3s linear forwards;

    pointer-events: none;

    z-index: 10;
}


@keyframes confettiFall {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }


    100% {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }

}


/* MOBILE */

@media (max-width: 500px) {

    .card {
        padding: 25px 15px;
    }

    h1 {
        font-size: 25px;
    }

    .gift {
        font-size: 70px;
    }

    button {
        padding: 13px 20px;
    }

    .textEmoji {
        font-size: 17px;
    }

}

</style>

</head>


<body>


<!-- MAIN CARD -->

<div class="card">


    <!-- SURPRISE SCREEN -->

    <div
        id="surpriseScreen"
    >

        <h2>
            A LITTLE SURPRISE FOR
        </h2>


        <h1>
            Ankita 🤣
        </h1>


        <p>
            I have something special for you...
        </p>


        <div
            class="gift"
            id="gift"
        >
            🎁
        </div>


        <p>
            Tap the gift 🎁
        </p>

    </div>



    <!-- QUESTION SCREEN -->

    <div
        id="proposalScreen"
        class="hidden"
    >

        <div style="font-size:60px;">
            🐶
        </div>


        <h1>
            VERY IMPORTANT QUESTION
        </h1>


        <h2 id="question">
            Are you kukur? 🐶
        </h2>


        <p id="subText">
            Be honest 😂
        </p>


        <div class="buttons">

            <button
                class="yes"
                id="yesButton"
            >
                Yes 😂
            </button>


            <button
                class="no"
                id="noButton"
            >
                No 😭
            </button>

        </div>

    </div>



    <!-- CELEBRATION SCREEN -->

    <div
        id="celebrationScreen"
        class="hidden"
    >

        <div class="celebration">
            🐶🤣🐶
        </div>


        <div class="bigText">
            I knew it now bark 😂
        </div>


        <h2>
            🐕 WOOF WOOF! 🐕
        </h2>


        <p>
            Officially confirmed 🤣
        </p>


        <div style="font-size:40px;">
            🤣 🐶 🔪 🐶 🤣
        </div>

    </div>

</div>



<!-- BARK SOUND -->

<audio
    id="barkSound"
    src="bark.mp3"
    preload="auto">
</audio>



<script>


/* GET ELEMENTS */

const gift =
    document.getElementById("gift");


const surpriseScreen =
    document.getElementById(
        "surpriseScreen"
    );


const proposalScreen =
    document.getElementById(
        "proposalScreen"
    );


const celebrationScreen =
    document.getElementById(
        "celebrationScreen"
    );


const yesButton =
    document.getElementById(
        "yesButton"
    );


const noButton =
    document.getElementById(
        "noButton"
    );


const question =
    document.getElementById(
        "question"
    );


const subText =
    document.getElementById(
        "subText"
    );


const barkSound =
    document.getElementById(
        "barkSound"
    );



/* VARIABLES */

let noCount = 0;

let teleporting = false;



/* OPEN GIFT */

gift.addEventListener(
    "click",
    function() {

        surpriseScreen
            .classList
            .add("hidden");


        proposalScreen
            .classList
            .remove("hidden");

    }
);



/* YES BUTTON */

yesButton.addEventListener(
    "click",
    function() {

        /* BARK */

        barkSound.currentTime = 0;

        barkSound
            .play()
            .catch(
                function(error) {

                    console.log(
                        "Bark could not play:",
                        error
                    );

                }
            );


        /* CELEBRATION */

        proposalScreen
            .classList
            .add("hidden");


        celebrationScreen
            .classList
            .remove("hidden");


        createConfetti();

    }
);



/* NO BUTTON */

noButton.addEventListener(
    "click",
    function() {


        if (teleporting) {

            moveNoButton();

            return;

        }


        noCount++;


        /* FIRST NO */

        if (noCount === 1) {

            question.innerText =
                "Are you sure? 🤨";


            subText.innerText =
                "Think carefully 😂";

        }


        /* SECOND NO */

        else if (noCount === 2) {

            question.innerText =
                "Really sure? 🧐";


            subText.innerText =
                "Last chance 😂";

        }


        /* THIRD NO */

        else if (noCount >= 3) {

            question.innerText =
                "Okay... catch the No 😂";


            subText.innerText =
                "It's running away! 🏃💨";


            startTeleport();

        }

    }
);



/* START TELEPORT */

function startTeleport() {

    teleporting = true;


    noButton
        .classList
        .add("teleport");


    moveNoButton();


    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );


    noButton.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            moveNoButton();

        }
    );

}



/* MOVE NO BUTTON */

function moveNoButton() {

    const buttonWidth =
        noButton.offsetWidth;


    const buttonHeight =
        noButton.offsetHeight;


    const maxX =
        window.innerWidth
        - buttonWidth
        - 10;


    const maxY =
        window.innerHeight
        - buttonHeight
        - 10;


    const randomX =
        Math.max(
            10,
            Math.random() * maxX
        );


    const randomY =
        Math.max(
            10,
            Math.random() * maxY
        );


    noButton.style.left =
        randomX + "px";


    noButton.style.top =
        randomY + "px";

}



/* FLOATING EMOJIS */

const funnyEmojis = [

    "🐶",
    "🤣",
    "🔪",
    "🐕",
    "😂"

];



/* FIRST FLOATING TEXT */

function createFirstFloatingText() {

    const text =
        document.createElement(
            "div"
        );


    text.className =
        "funnyEmoji textEmoji";


    text.innerText =
        "The moon is beautiful, isn't it? 🌙";


    text.style.left =
        "50%";


    text.style.animationDuration =
        "15s";


    document.body.appendChild(
        text
    );


    setTimeout(
        function() {

            text.remove();

        },
        16000
    );

}



/* NORMAL FLOATING EMOJI */

function createFunnyEmoji() {

    const emoji =
        document.createElement(
            "div"
        );


    emoji.className =
        "funnyEmoji";


    emoji.innerText =
        funnyEmojis[
            Math.floor(
                Math.random()
                *
                funnyEmojis.length
            )
        ];


    emoji.style.left =
        (10 + Math.random() * 80)
        + "vw";


    emoji.style.animationDuration =
        (10 + Math.random() * 5)
        + "s";


    document.body.appendChild(
        emoji
    );


    setTimeout(
        function() {

            emoji.remove();

        },
        16000
    );

}



/*
    THE MOON TEXT IS FIRST
*/

createFirstFloatingText();



/*
    EMOJIS START AFTER 1.5 SECONDS
*/

setTimeout(
    function() {

        createFunnyEmoji();


        setInterval(
            createFunnyEmoji,
            1800
        );

    },
    1500
);



/* CONFETTI */

function createConfetti() {

    const confettiEmojis = [

        "🎉",
        "🤣",
        "🐶",
        "😂",
        "✨",
        "🐕"

    ];


    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const confetti =
            document.createElement(
                "div"
            );


        confetti.className =
            "confetti";


        confetti.innerText =
            confettiEmojis[
                Math.floor(
                    Math.random()
                    *
                    confettiEmojis.length
                )
            ];


        confetti.style.left =
            Math.random() * 100
            + "vw";


        confetti.style.animationDelay =
            Math.random() * 1.5
            + "s";


        document.body.appendChild(
            confetti
        );


        setTimeout(
            function() {

                confetti.remove();

            },
            4500
        );

    }

}

</script>

</body>
    </html>
