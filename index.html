<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Someone's Surprise 🤣</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffc2d9);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 30px 20px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    position: relative;
    z-index: 5;
}

.screen {
    display: block;
}

.hidden {
    display: none;
}

h1 {
    color: #ff4f81;
    margin-bottom: 10px;
}

h2 {
    color: #ff4f81;
}

p {
    color: #555;
    font-size: 17px;
}

.gift {
    font-size: 80px;
    cursor: pointer;
    margin: 20px 0;
    animation: bounce 1.2s infinite;
    user-select: none;
}

@keyframes bounce {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
    min-height: 55px;
}

button {
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.yes {
    background: #ff4f81;
    color: white;
}

.no {
    background: #eeeeee;
    color: #444;
}

#noButton {
    transition: 0.2s;
}

.funnyEmoji {
    position: fixed;
    bottom: -50px;
    font-size: 30px;
    pointer-events: none;
    animation: funnyFloat 5s linear forwards;
    z-index: 1;
}

@keyframes funnyFloat {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }

}

.celebration {
    font-size: 45px;
    margin-bottom: 10px;
}

.bigText {
    font-size: 26px;
    font-weight: bold;
    color: #ff4f81;
}

.confetti {
    position: fixed;
    top: -30px;
    font-size: 25px;
    animation: confettiFall 3s linear forwards;
    pointer-events: none;
    z-index: 10;
}

@keyframes confettiFall {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }

}

#noButton.teleport {
    position: fixed;
    z-index: 20;
}

@media (max-width: 500px) {

    .card {
        padding: 25px 15px;
    }

    h1 {
        font-size: 25px;
    }

    .gift {
        font-size: 70px;
    }

    button {
        padding: 13px 20px;
    }

}

</style>
</head>

<body>

<div class="card">

    <!-- SURPRISE SCREEN -->

    <div id="surpriseScreen" class="screen">

        <h2>A LITTLE SURPRISE FOR</h2>

        <h1>Ankita 🤣</h1>

        <p>
            I have something special for you...
        </p>

        <div class="gift" id="gift">
            🎁
        </div>

        <p>
            Tap the gift 🎁
        </p>

    </div>


    <!-- QUESTION SCREEN -->

    <div id="proposalScreen" class="screen hidden">

        <div style="font-size:60px;">
            🐶
        </div>

        <h1>
            VERY IMPORTANT QUESTION
        </h1>

        <h2 id="question">
            Are you kukur? 🐶
        </h2>

        <p id="subText">
            Be honest 😂
        </p>

        <div class="buttons">

            <button class="yes" id="yesButton">
                Yes 😂
            </button>

            <button class="no" id="noButton">
                No 😭
            </button>

        </div>

    </div>


    <!-- CELEBRATION SCREEN -->

    <div id="celebrationScreen" class="screen hidden">

        <div class="celebration">
            🐶🤣🐶
        </div>

        <div class="bigText">
            I knew it now bark 😂
        </div>

        <h2>
            🐕 WOOF WOOF! 🐕
        </h2>

        <p>
            Officially confirmed 🤣
        </p>

        <div style="font-size:40px;">
            🤣 🐶 🔪 🐶 🤣
        </div>

    </div>

</div>


<!-- BARK SOUND -->

<audio id="barkSound" src="bark.mp3" preload="auto"></audio>


<script>

const gift = document.getElementById("gift");

const surpriseScreen =
    document.getElementById("surpriseScreen");

const proposalScreen =
    document.getElementById("proposalScreen");

const celebrationScreen =
    document.getElementById("celebrationScreen");

const yesButton =
    document.getElementById("yesButton");

const noButton =
    document.getElementById("noButton");

const question =
    document.getElementById("question");

const subText =
    document.getElementById("subText");

const barkSound =
    document.getElementById("barkSound");


let noCount = 0;
let teleporting = false;


// OPEN GIFT

gift.addEventListener("click", function() {

    surpriseScreen.classList.add("hidden");

    proposalScreen.classList.remove("hidden");

});


// YES BUTTON

yesButton.addEventListener("click", function() {

    // Play bark
    barkSound.currentTime = 0;

    barkSound.play().catch(function(error) {
        console.log("Sound could not play:", error);
    });


    proposalScreen.classList.add("hidden");

    celebrationScreen.classList.remove("hidden");

    createConfetti();

});


// NO BUTTON

noButton.addEventListener("click", function() {

    if (teleporting) {

        moveNoButton();

        return;

    }


    noCount++;


    if (noCount === 1) {

        question.innerText =
            "Are you sure? 🤨";

        subText.innerText =
            "Think carefully 😂";

    }


    else if (noCount === 2) {

        question.innerText =
            "Really sure? 🧐";

        subText.innerText =
            "Last chance 😂";

    }


    else if (noCount >= 3) {

        question.innerText =
            "Okay... catch the No 😂";

        subText.innerText =
            "It's running away! 🏃💨";

        startTeleport();

    }

});


// START TELEPORTING NO BUTTON

function startTeleport() {

    teleporting = true;

    noButton.classList.add("teleport");

    moveNoButton();

    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );

    noButton.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            moveNoButton();

        }
    );

}


// MOVE NO BUTTON

function moveNoButton() {

    const buttonWidth =
        noButton.offsetWidth;

    const buttonHeight =
        noButton.offsetHeight;


    const maxX =
        window.innerWidth - buttonWidth - 10;

    const maxY =
        window.innerHeight - buttonHeight - 10;


    const randomX =
        Math.max(10, Math.random() * maxX);

    const randomY =
        Math.max(10, Math.random() * maxY);


    noButton.style.left =
        randomX + "px";

    noButton.style.top =
        randomY + "px";

}


// FUNNY FLOATING EMOJIS

const funnyEmojis = [
    "🐶",
    "🤣",
    "🔪",
    "🐕",
    "😂"
];


function createFunnyEmoji() {

    const emoji =
        document.createElement("div");

    emoji.className =
        "funnyEmoji";

    emoji.innerText =
        funnyEmojis[
            Math.floor(
                Math.random() *
                funnyEmojis.length
            )
        ];


    emoji.style.left =
        Math.random() * 100 + "vw";


    emoji.style.animationDuration =
        (3 + Math.random() * 3) + "s";


    document.body.appendChild(emoji);


    setTimeout(function() {

        emoji.remove();

    }, 6000);

}


setInterval(createFunnyEmoji, 700);


// CONFETTI

function createConfetti() {

    const confettiEmojis = [
        "🎉",
        "🤣",
        "🐶",
        "😂",
        "✨",
        "🐕"
    ];


    for (let i = 0; i < 40; i++) {

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.innerText =
            confettiEmojis[
                Math.floor(
                    Math.random() *
                    confettiEmojis.length
                )
            ];


        confetti.style.left =
            Math.random() * 100 + "vw";


        confetti.style.animationDelay =
            Math.random() * 1.5 + "s";


        document.body.appendChild(confetti);


        setTimeout(function() {

            confetti.remove();

        }, 4500);

    }

}

</script>

</body>
          </html>
